<!doctype html><html><body style="margin:0;background:transparent">
<script src="three.min.js"></script>
<script>
window.renderShot = async (view, W0, H0) => {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W0, H0); renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(view === 'flat' ? 12 : 24, W0 / H0, 0.1, 100);
  scene.add(new THREE.HemisphereLight(0xf6f4ff, 0x22264a, 0.7));
  const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(1.4, 7, 3.4); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 15 }); key.shadow.radius = 22; key.shadow.bias = -0.0004;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xb8c6ff, 0.35); fill.position.set(-4, 1, 3); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xe2c078, 0.6); rim.position.set(-3, 3, -4); scene.add(rim);
  const loader = new THREE.TextureLoader();
  const load = (s) => new Promise(r => loader.load(s, t => { t.encoding = THREE.sRGBEncoding; t.anisotropy = 16; r(t); }));
  const [ft, bt] = await Promise.all([load('front.jpg'), load('back.jpg')]);
  const edge = (vertical) => { const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
    g.fillStyle = '#f3f2ed'; g.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 260; i++) { const p = i * (1024 / 260); g.fillStyle = i % 2 ? 'rgba(82,90,125,.12)' : 'rgba(255,255,255,.45)'; vertical ? g.fillRect(p, 0, 1.4, 1024) : g.fillRect(0, p, 1024, 1.4); }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; };
  const W = 1.48, H = 2.1, CT = 0.022, BT = 0.17;
  const board = new THREE.MeshStandardMaterial({ color: 0x141836, roughness: 0.7 });
  const fm = new THREE.MeshStandardMaterial({ map: ft, roughness: 0.34, metalness: 0.02 });
  const bm = new THREE.MeshStandardMaterial({ map: bt, roughness: 0.34, metalness: 0.02 });
  const eV = new THREE.MeshStandardMaterial({ map: edge(true), roughness: 1 }), eH = new THREE.MeshStandardMaterial({ map: edge(false), roughness: 1 });
  const paper = new THREE.MeshStandardMaterial({ color: 0xf3f2ed, roughness: 0.95 });
  const gold = new THREE.MeshStandardMaterial({ color: 0xd4a640, metalness: 0.92, roughness: 0.22 });
  const mk = (g, m) => { const x = new THREE.Mesh(g, m); x.castShadow = x.receiveShadow = true; return x; };
  function journal() {
    const b = new THREE.Group();
    const back = mk(new THREE.BoxGeometry(W, H, CT), [board, board, board, board, paper, bm]); back.position.z = -(BT / 2 + CT / 2); b.add(back);
    const block = mk(new THREE.BoxGeometry(W - 0.05, H - 0.05, BT), [eV, eV, eH, eH, paper, paper]); block.position.x = 0.01; b.add(block);
    const front = mk(new THREE.BoxGeometry(W, H, CT), [board, board, board, board, fm, paper]); front.position.z = BT / 2 + CT / 2; b.add(front);
    const tor = new THREE.TorusGeometry(BT / 2 + CT + 0.012, 0.0048, 10, 40);
    for (let i = 0; i < 34; i++) { const y = -H / 2 + 0.07 + i * (H - 0.14) / 33;
      for (const dy of [-0.009, 0.009]) { const t = new THREE.Mesh(tor, gold); t.rotation.x = Math.PI / 2; t.position.set(-W / 2 + 0.035, y + dy, 0); t.castShadow = true; b.add(t); } }
    return b;
  }
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.3 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -1.08; floor.receiveShadow = true; scene.add(floor);
  let d = 6.4, look = [0, -0.02, 0], camY = 0.55;
  if (view === 'front' || view === 'back') {
    const j = journal(); j.rotation.set(0.1, view === 'front' ? -0.4 : Math.PI + 0.4, 0); j.position.y = 0.0; scene.add(j);
  } else if (view === 'flat') {
    const j = journal(); scene.add(j); d = 12.4; camY = 0; floor.visible = false; look = [0, 0, 0];
  } else if (view === 'pair') {
    const a = journal(); a.rotation.set(0.08, Math.PI + 0.55, 0); a.position.set(-0.78, 0, -0.9); scene.add(a);
    const b = journal(); b.rotation.set(0.08, -0.35, 0); b.position.set(0.62, 0, 0.35); scene.add(b);
    d = 8.6; look = [0, -0.02, -0.2];
  }
  camera.position.set(0, camY, d); camera.lookAt(...look);
  renderer.render(scene, camera); renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
</script></body></html>
